{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold text-dark"><i class="bi bi-database-gear text-primary me-2"></i>Mantenimiento del Sistema</h2>
            <p class="text-muted">Respalda y restaura los módulos de Seguridad y Automall del Centro.</p>
        </div>
    </div>

    <!-- Contenedor de Alertas Globales -->
    <div id="alert-container"></div>

    <div class="row g-4">
        <!-- MÓDULO AUTOMALL -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-car-front-fill text-primary fs-3"></i>
                        </div>
                        <div>
                            <h4 class="card-title fw-bold mb-0">Base de Datos: automall</h4>
                            <small class="text-muted">Datos de vehículos, ventas y clientes</small>
                        </div>
                    </div>
                    <hr>
                    <div class="d-grid gap-3">
                        <button onclick="ejecutarBackup('automall')" class="btn btn-primary py-2">
                            <i class="bi bi-download me-2"></i>Respaldar en la PC
                        </button>
                        
                        <div class="border p-3 rounded bg-light">
                            <label class="form-label small fw-bold text-secondary">Restaurar Respaldo (.sql)</label>
                            <input type="file" id="file-automall" class="form-control form-control-sm mb-2" accept=".sql">
                            <button onclick="ejecutarRestore('automall')" class="btn btn-outline-danger btn-sm w-100">
                                <i class="bi bi-upload me-2"></i>Ejecutar Restauración
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MÓDULO SEGURIDAD -->
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-dark bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-shield-lock-fill text-dark fs-3"></i>
                        </div>
                        <div>
                            <h4 class="card-title fw-bold mb-0">Base de Datos: seguridad</h4>
                            <small class="text-muted">Usuarios, roles, sesiones y auditoría</small>
                        </div>
                    </div>
                    <hr>
                    <div class="d-grid gap-3">
                        <button onclick="ejecutarBackup('seguridad')" class="btn btn-dark py-2">
                            <i class="bi bi-download me-2"></i>Respaldar en la PC
                        </button>
                        
                        <div class="border p-3 rounded bg-light">
                            <label class="form-label small fw-bold text-secondary">Restaurar Respaldo (.sql)</label>
                            <input type="file" id="file-seguridad" class="form-control form-control-sm mb-2" accept=".sql">
                            <button onclick="ejecutarRestore('seguridad')" class="btn btn-outline-danger btn-sm w-100">
                                <i class="bi bi-upload me-2"></i>Ejecutar Restauración
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/mantenimiento.js') }}"></script>
{% endblock %}

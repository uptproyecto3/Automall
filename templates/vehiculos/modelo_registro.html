{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        
        <!-- COLUMNA IZQUIERDA: FORMULARIO  -->
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nuevo Modelo</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('modelo.registro_modelo') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Modelo</label>
                            <input type="text" name="nombre_modelo" class="form-control" placeholder="Ej: Corolla..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Estado</label>
                            <select name="estado" class="form-control" required>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success shadow-sm">
                                <i class="bi bi-save me-1"></i> Guardar Modelo
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: TABLA DE LISTADO  -->
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Modelos Registrados</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for modelo in modelos %}
                                <tr>
                                    <td><span class="text-muted fw-bold">{{ modelo.cod_modelo }}</span></td>
                                    <td class="fw-bold text-dark">{{ modelo.nombre_modelo }}</td>
                                    <td class="text-center">
                                        <!-- Botón de eliminar (puedes añadir la ruta luego) -->
                                        <button class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% if not modelos %}
                        <div class="text-center py-4">
                            <p class="text-muted">No hay modelos registrados aún.</p>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

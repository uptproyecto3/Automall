{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card border-0">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-person-search text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-3">Recuperar Acceso</h3>
                    <p class="text-muted small">Ingresa tu correo para validar tu identidad mediante tu pregunta de seguridad.</p>
                    
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-danger small py-2">{{ messages[0] }}</div>
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('auth.recuperar') }}" method="POST" class="mt-4 text-start">
                        <div class="mb-4">
                            <label class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control auth-control" placeholder="nombre@ejemplo.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-registrar w-100 py-2">Buscar mi pregunta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

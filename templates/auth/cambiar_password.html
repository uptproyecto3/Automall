{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-success" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-3">Nueva Contraseña</h3>
                        <p class="text-muted small">Identidad confirmada. Por favor, ingresa tu nueva clave de acceso.</p>
                    </div>

                    <form action="{{ url_for('auth.cambiar_password') }}" method="POST">
                        <div class="mb-4">
                            <label class="form-label">Nueva Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="nueva_password" class="form-control auth-control" placeholder="Mínimo 8 caracteres" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-registrar w-100 py-2">Actualizar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

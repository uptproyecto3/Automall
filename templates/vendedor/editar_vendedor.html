<form action="/vendedores/guardar" method="POST">

    <input type="text"
           name="cedula"
           placeholder="Cédula">

    <input type="text"
           name="nombres"
           placeholder="Nombres">

    <input type="text"
           name="apellidos"
           placeholder="Apellidos">

    <input type="text"
           name="telefono"
           placeholder="Teléfono">

    <input type="email"
           name="correo"
           placeholder="Correo">

    <textarea name="direccion"></textarea>

    <input type="date"
           name="fecha_ingreso">

    <input type="number"
           step="0.01"
           name="comision">

    <button type="submit">
        Guardar
    </button>

</form>
